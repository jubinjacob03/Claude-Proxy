name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify web build
        working-directory: web
        run: |
          npm ci
          npm run build

  build-relay:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build relay binaries
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/claude-relay-${os}-${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" ./cmd/claude-relay
          done
      - uses: actions/upload-artifact@v4
        with:
          name: claude-relay-binaries
          path: dist/

  build-client:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./make.ps1 installer
      - uses: actions/upload-artifact@v4
        with:
          name: claude-client-windows
          path: |
            installer/out/Claude-Proxy-Setup.exe
            installer/out/staging/claude-proxy.exe
            installer/out/staging/claude-tray.exe
