services:
  claude-proxy:
    build: .
    image: claude-proxy:latest
    container_name: claude-proxy
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      UPSTREAM_BASE_URL: https://gorouter.app
      UPSTREAM_FORMAT: anthropic
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?set UPSTREAM_API_KEY in your shell or .env}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-opus-4-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
